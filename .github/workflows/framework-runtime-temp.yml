name: Framework runtime smoke temp

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      RESEND_API_KEY: re_dummy
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: framework-next15-2-3b

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Start built Next server
        run: |
          npm start > next-start.log 2>&1 &
          echo $! > next-start.pid
          for i in $(seq 1 30); do
            if curl -sS --max-time 2 http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat next-start.log
          exit 1

      - name: Verify protected API through actual Next proxy
        run: |
          status=$(curl -sS --max-time 10 -o protected.json -w '%{http_code}' 'http://127.0.0.1:3000/api/vehicle-info?reg=GEU29F')
          if [ "$status" != "401" ]; then
            echo "Unexpected status: $status"
            cat protected.json
            cat next-start.log
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('protected.json', 'utf8'));
          if (body.error !== 'Authentication required') throw new Error(JSON.stringify(body));
          console.log('NEXT_RUNTIME_PROTECTED_API_OK', 401, body.error);
          NODE

      - name: Verify health and read-only page routing
        run: |
          for path in /api/health / /check /ankomst /status /nybil /rapport; do
            status=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$path")
            if [ "$status" != "200" ]; then
              echo "Unexpected status $status for $path"
              cat next-start.log
              exit 1
            fi
            echo "NEXT_RUNTIME_ROUTE_OK $status $path"
          done

      - name: Stop server
        if: always()
        run: |
          if [ -f next-start.pid ]; then
            kill $(cat next-start.pid) || true
          fi
          rm -f protected.json next-start.pid
