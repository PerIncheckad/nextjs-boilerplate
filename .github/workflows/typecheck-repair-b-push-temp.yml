name: Temporary TypeScript repair B push

on:
  push:
    branches:
      - stabilize-build-gates

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: stabilize-build-gates

      - name: Extract and apply Repair B patch
        shell: bash
        run: |
          sed -n "/python3 - <<'PY'/,/^          PY$/p" .github/workflows/typecheck-repair-b-pr-temp.yml | sed '1d;$d;s/^          //' > /tmp/repair-b.py
          python3 /tmp/repair-b.py
          git diff --check
          git diff --stat

      - name: Commit Repair B
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/check/form-client.tsx lib/vehicle-status.ts
          git commit -m 'Align remaining TypeScript data contracts'
          git push origin HEAD:stabilize-build-gates
