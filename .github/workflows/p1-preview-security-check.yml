name: P1 Preview Security Check

on:
  push:
    branches:
      - security-p1-api-auth
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  preview-security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production health route
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://incheckad.se'
          curl -sS -L -o /dev/null -w 'HEALTH_STATUS=%{http_code}\nHEALTH_FINAL_URL=%{url_effective}\n' "$BASE/api/health"

      - name: Probe production protected read route without authentication
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://incheckad.se'
          curl -sS -L -o /dev/null -w 'PROTECTED_STATUS=%{http_code}\nPROTECTED_FINAL_URL=%{url_effective}\n' "$BASE/api/vehicle-info?reg=GEU29F"
