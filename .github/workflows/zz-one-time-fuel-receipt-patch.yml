name: One-time fuel receipt patch

on:
  push:
    branches:
      - checkin-required-fuel-receipt-evidence
    paths:
      - .github/workflows/zz-one-time-fuel-receipt-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: checkin-required-fuel-receipt-evidence
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/one_time_fuel_receipt_patch.py
      - name: Commit patch
        run: |
          git config user.name "PerIncheckad"
          git config user.email "per@incheckad.se"
          git add app/check/form-client.tsx app/api/notify/legacy-handler.ts
          git diff --cached --quiet && exit 0
          git commit -m "Require receipt evidence or explicit missing-receipt reason"
          git push origin HEAD:checkin-required-fuel-receipt-evidence
