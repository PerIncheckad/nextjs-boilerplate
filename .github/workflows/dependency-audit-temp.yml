name: Dependency audit temp

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit-dependencies-step-2-3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install exact baseline lockfile
        run: npm ci

      - name: Baseline dependency paths
        run: npm ls brace-expansion editorconfig glob js-cookie minimatch nanoid picomatch ws postcss next --all || true

      - name: Test minimal non-major security candidate
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact next@14.2.35
          npm update --package-lock-only --ignore-scripts postcss
          npm audit fix --package-lock-only --ignore-scripts || true
          echo 'CANDIDATE_DIFF_START'
          git diff -- package.json package-lock.json
          echo 'CANDIDATE_DIFF_END'
          npm ci
          npm run typecheck
          npm audit --json > candidate-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('candidate-audit.json', 'utf8'));
          const out = {
            metadata: audit.metadata,
            vulnerabilities: Object.fromEntries(Object.entries(audit.vulnerabilities || {}).map(([name, v]) => [name, {
              severity: v.severity,
              isDirect: v.isDirect,
              range: v.range,
              fixAvailable: v.fixAvailable,
              via: (v.via || []).map(x => typeof x === 'string' ? x : {
                source: x.source,
                name: x.name,
                title: x.title,
                severity: x.severity,
                range: x.range,
                url: x.url
              })
            }]))
          };
          console.log('CANDIDATE_AUDIT_START');
          console.log(JSON.stringify(out, null, 2));
          console.log('CANDIDATE_AUDIT_END');
          NODE
