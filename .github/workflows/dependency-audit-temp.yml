name: Dependency repair temp

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout security fix branch
        uses: actions/checkout@v4
        with:
          ref: security-dependencies-2-3a

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install baseline
        run: npm ci

      - name: Apply non-major security repair
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact next@14.2.35
          npm update --package-lock-only --ignore-scripts postcss
          npm audit fix --package-lock-only --ignore-scripts || true
          git diff --check

      - name: Verify repaired dependency set
        run: |
          npm ci
          npm run typecheck
          npm audit --json > audit-after.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit-after.json', 'utf8'));
          console.log('FINAL_AUDIT_COUNTS', JSON.stringify(audit.metadata?.vulnerabilities || {}));
          for (const [name, v] of Object.entries(audit.vulnerabilities || {})) {
            console.log('REMAINING', name, v.severity, v.range);
          }
          if ((audit.metadata?.vulnerabilities?.critical || 0) > 0) {
            process.exit(1);
          }
          NODE

      - name: Commit dependency repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'Patch dependency security baseline'
          git push origin HEAD:security-dependencies-2-3a
