name: Temporary TypeScript repair A PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: stabilize-build-gates

      - name: Extract and apply verified repair script
        shell: bash
        run: |
          sed -n "/python3 - <<'PY'/,/^          PY$/p" .github/workflows/typecheck-repair-a-temp.yml | sed '1d;$d;s/^          //' > /tmp/repair-a.py
          set +e
          REPAIR_OUTPUT=$(python3 /tmp/repair-a.py 2>&1)
          REPAIR_STATUS=$?
          set -e
          echo "$REPAIR_OUTPUT"
          if [ "$REPAIR_STATUS" -ne 0 ] && ! printf '%s' "$REPAIR_OUTPUT" | grep -q "check getPublicUrl block: expected exactly 1 match, found 0"; then
            exit "$REPAIR_STATUS"
          fi

          # The first script intentionally stopped before writing app/check because
          # the source block has different whitespace than the initial snapshot.
          # Apply the same check-only mechanical edits with structural boundaries.
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/check/form-client.tsx')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          helper = """const getDamagePositions = (damageType: string, carPart: string): readonly string[] => {
            if (!damageType || !carPart) return [];
            const typeOptions = DAMAGE_OPTIONS[damageType as keyof typeof DAMAGE_OPTIONS] as unknown as Record<string, readonly string[]> | undefined;
            return typeOptions?.[carPart] ?? [];
          };

          """
          marker = "const DAMAGE_TYPES = Object.keys(DAMAGE_OPTIONS).sort((a, b) => a.localeCompare(b, 'sv'));\n\n"
          replace_once(marker, marker + helper, 'check damage helper insertion')

          replacements = [
              ("DAMAGE_OPTIONS[d.type as keyof typeof DAMAGE_OPTIONS]?.[p.carPart as keyof typeof DAMAGE_OPTIONS[keyof typeof DAMAGE_OPTIONS][string]] || []", 'getDamagePositions(d.type, p.carPart)', 2, 'check new damage positions'),
              ("DAMAGE_OPTIONS[d.userType as keyof typeof DAMAGE_OPTIONS]?.[p.carPart as keyof typeof DAMAGE_OPTIONS[keyof typeof DAMAGE_OPTIONS][string]] || []", "getDamagePositions(d.userType || '', p.carPart)", 1, 'check existing damage positions'),
              ("DAMAGE_OPTIONS[damageType as keyof typeof DAMAGE_OPTIONS]?.[pos.carPart as keyof typeof DAMAGE_OPTIONS[keyof typeof DAMAGE_OPTIONS][string]] || []", "getDamagePositions(damageType || '', pos.carPart)", 1, 'check DamageItem positions'),
          ]
          for old, new, expected, label in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} matches, found {count}')
              text = text.replace(old, new)

          replace_once(
              'const { data, error: urlError } = supabase.storage.from(BUCKET).getPublicUrl(path);',
              'const { data } = supabase.storage.from(BUCKET).getPublicUrl(path);',
              'check getPublicUrl destructure',
          )
          error_start = text.index('      if (urlError) {')
          next_guard = text.index('      if (!data?.publicUrl) {', error_start)
          text = text[:error_start] + text[next_guard:]

          replace_once(
              'const processFiles = async (files: FileList): Promise<MediaFile[]> => {\n  const processed = await Promise.all(Array.from(files).map(async file => {',
              'const processFiles = async (files: FileList): Promise<MediaFile[]> => {\n  const processed: Array<MediaFile | null> = await Promise.all(Array.from(files).map(async (file): Promise<MediaFile | null> => {',
              'check processFiles typing',
          )
          replace_once(
              'function slugify(str: string): string {',
              'function slugify(str: string | null | undefined): string {',
              'check slugify input',
          )
          replace_once(
              '            let typeString = type;',
              '            let typeString: string = type;',
              'check sanering typeString',
          )
          path.write_text(text)
          print('check mechanical repairs applied')
          PY

          git diff --check
          git diff --stat

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Measure TypeScript after repair A
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false 2>&1 | tee tsc-after.log
          TSC_STATUS=${PIPESTATUS[0]}
          ERROR_COUNT=$(grep -c 'error TS' tsc-after.log || true)
          FILE_COUNT=$(grep 'error TS' tsc-after.log | sed -E 's/^([^(:]+).*/\1/' | sort -u | wc -l | tr -d ' ')
          echo "TSC_EXIT=$TSC_STATUS"
          echo "TSC_ERROR_COUNT=$ERROR_COUNT"
          echo "TSC_FILE_COUNT=$FILE_COUNT"
          echo '--- errors by file ---'
          grep 'error TS' tsc-after.log | sed -E 's/^([^(:]+).*/\1/' | sort | uniq -c | sort -nr || true
          exit 0

      - name: Commit repair A to branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/check/form-client.tsx app/nybil/form-client.tsx app/status/form-client.tsx components/ImageAnnotator.tsx components/MediaGallery.tsx lib/damages.ts
          git commit -m 'Repair mechanical TypeScript errors' || exit 0
          git push origin HEAD:stabilize-build-gates
