name: Patch Nybil reader

on:
  push:
    branches:
      - agent/step-3-2d-2-nybil-readers

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch exact legacy reader references
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/vehicle-status.ts')
          text = path.read_text()

          replacements = [
              ("  bilmodell?: string;\n", ""),
              ("      if (nybilData?.bilmodell) return nybilData.bilmodell;\n", ""),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/vehicle-status.ts
          git diff --cached --check
          git commit -m "3.2D-2: use canonical Nybil model reader"
          git push
