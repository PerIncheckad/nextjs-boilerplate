name: Temporary TypeScript repair A

on:
  push:
    branches:
      - stabilize-build-gates

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: stabilize-build-gates

      - name: Apply mechanical type repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          # app/status/form-client.tsx: preserve runtime behavior, make existing guards visible to TS.
          path = 'app/status/form-client.tsx'
          text = read(path)
          text = replace_once(
              text,
              '{vehicleStatus?.found && vehicleStatus.nybilPhotos?.photoUrls?.length > 0 && (',
              '{vehicleStatus?.found && (vehicleStatus.nybilPhotos?.photoUrls?.length ?? 0) > 0 && (',
              'status nybil photo length guard',
          )
          text = replace_once(
              text,
              '{vehicleStatus.nybilPhotos.photoUrls.map((url, index) => (',
              '{vehicleStatus.nybilPhotos?.photoUrls?.map((url, index) => (',
              'status nybil photo map guard',
          )
          marker = 'Object.entries(pendingEdits).map(([field, value]) => {'
          start = text.index(marker)
          insert_at = text.index('\n', start) + 1
          end = text.index('// Översätt enum-värden', insert_at)
          segment = text[insert_at:end]
          count = segment.count('vehicleStatus.vehicle.')
          if count < 1:
              raise SystemExit('status edit confirm: no vehicleStatus.vehicle references found')
          segment = (
              '                  const currentVehicle = vehicleStatus.vehicle;\n'
              '                  if (!currentVehicle) return null;\n' +
              segment.replace('vehicleStatus.vehicle.', 'currentVehicle.')
          )
          text = text[:insert_at] + segment + text[end:]
          write(path, text)
          print(f'status: narrowed {count} vehicle references')

          # components/ImageAnnotator.tsx: widen literal-inferred state to the existing option unions.
          path = 'components/ImageAnnotator.tsx'
          text = read(path)
          text = replace_once(
              text,
              'const [selectedColor, setSelectedColor] = useState(NEON_COLORS[0].value);',
              "const [selectedColor, setSelectedColor] = useState<(typeof NEON_COLORS)[number]['value']>(NEON_COLORS[0].value);",
              'ImageAnnotator selectedColor',
          )
          text = replace_once(
              text,
              'const [selectedLineWidth, setSelectedLineWidth] = useState(LINE_WIDTHS.THIN);',
              "const [selectedLineWidth, setSelectedLineWidth] = useState<(typeof LINE_WIDTHS)[keyof typeof LINE_WIDTHS]>(LINE_WIDTHS.THIN);",
              'ImageAnnotator selectedLineWidth',
          )
          write(path, text)

          # components/MediaGallery.tsx: MediaModal already renders its no-media state; remove stale prop only.
          path = 'components/MediaGallery.tsx'
          text = read(path)
          text = replace_once(
              text,
              '                showNoMedia={skada.media.length === 0}\n',
              '',
              'MediaGallery stale showNoMedia prop',
          )
          write(path, text)

          helper = """const getDamagePositions = (damageType: string, carPart: string): readonly string[] => {
            if (!damageType || !carPart) return [];
            const typeOptions = DAMAGE_OPTIONS[damageType as keyof typeof DAMAGE_OPTIONS] as unknown as Record<string, readonly string[]> | undefined;
            return typeOptions?.[carPart] ?? [];
          };

          """

          # app/nybil/form-client.tsx: align current Supabase getPublicUrl typing and centralize safe DAMAGE_OPTIONS lookup.
          path = 'app/nybil/form-client.tsx'
          text = read(path)
          insert_marker = '// Build position string for damage folder/file naming\n'
          if helper.strip() not in text:
              text = replace_once(text, insert_marker, helper + insert_marker, 'nybil damage position helper insertion')
          old_expr = "DAMAGE_OPTIONS[damage.damageType as keyof typeof DAMAGE_OPTIONS]?.[pos.carPart as keyof (typeof DAMAGE_OPTIONS)[keyof typeof DAMAGE_OPTIONS]] || []"
          count = text.count(old_expr)
          if count != 2:
              raise SystemExit(f'nybil DAMAGE_OPTIONS: expected 2 matches, found {count}')
          text = text.replace(old_expr, 'getDamagePositions(damage.damageType, pos.carPart)')
          text = replace_once(
              text,
              'const { data, error: urlError } = supabase.storage.from(bucket).getPublicUrl(path);',
              'const { data } = supabase.storage.from(bucket).getPublicUrl(path);',
              'nybil getPublicUrl destructure',
          )
          text = replace_once(
              text,
              'if (urlError || !data?.publicUrl) {',
              'if (!data?.publicUrl) {',
              'nybil getPublicUrl condition',
          )
          text = replace_once(
              text,
              'console.error(`Error getting public URL for ${path}:`, urlError);',
              'console.error(`Error getting public URL for ${path}`);',
              'nybil getPublicUrl log',
          )
          write(path, text)

          # lib/damages.ts: make declared types/query match fields already consumed by the code and server response.
          path = 'lib/damages.ts'
          text = read(path)
          text = replace_once(
              text,
              "type CheckinDamageData = {\n  type: 'existing' | 'not_found' | 'documented';",
              "type CheckinDamageData = {\n  id?: number;\n  type: 'existing' | 'not_found' | 'documented';",
              'damages CheckinDamageData id',
          )
          text = replace_once(
              text,
              '  handled_video_urls?: string[];  // Video URLs from checkin_damages\n};',
              '  handled_video_urls?: string[];  // Video URLs from checkin_damages\n  handled_at?: string | null;  // Timestamp when damage was handled\n};',
              'damages ConsolidatedDamage handled_at',
          )
          text = replace_once(
              text,
              ".select('regnr, bilmarke, modell, hjul_forvaring_ort, hjul_forvaring_spec, hjul_forvaring, saludatum')",
              ".select('regnr, bilmarke, modell, hjul_forvaring_ort, hjul_forvaring_spec, hjul_forvaring, saludatum, bransletyp')",
              'damages nybil bransletyp select',
          )
          write(path, text)

          # app/check/form-client.tsx: same API/type drift fixes, without changing validation rules or upload paths.
          path = 'app/check/form-client.tsx'
          text = read(path)
          damage_types_marker = "const DAMAGE_TYPES = Object.keys(DAMAGE_OPTIONS).sort((a, b) => a.localeCompare(b, 'sv'));\n\n"
          if helper.strip() not in text:
              text = replace_once(text, damage_types_marker, damage_types_marker + helper, 'check damage position helper insertion')

          replacements = [
              ("DAMAGE_OPTIONS[d.type as keyof typeof DAMAGE_OPTIONS]?.[p.carPart as keyof typeof DAMAGE_OPTIONS[keyof typeof DAMAGE_OPTIONS][string]] || []", 'getDamagePositions(d.type, p.carPart)', 2, 'check new damage positions'),
              ("DAMAGE_OPTIONS[d.userType as keyof typeof DAMAGE_OPTIONS]?.[p.carPart as keyof typeof DAMAGE_OPTIONS[keyof typeof DAMAGE_OPTIONS][string]] || []", "getDamagePositions(d.userType || '', p.carPart)", 1, 'check existing damage positions'),
              ("DAMAGE_OPTIONS[damageType as keyof typeof DAMAGE_OPTIONS]?.[pos.carPart as keyof typeof DAMAGE_OPTIONS[keyof typeof DAMAGE_OPTIONS][string]] || []", "getDamagePositions(damageType || '', pos.carPart)", 1, 'check DamageItem positions'),
          ]
          for old, new, expected, label in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} matches, found {count}')
              text = text.replace(old, new)

          old_upload_block = """      const { data, error: urlError } = supabase.storage.from(BUCKET).getPublicUrl(path);
          if (urlError) {
            console.error(`Failed to get public url for ${path} (attempt ${attempt}/${MAX_RETRIES}):`, urlError);
            
            if (attempt < MAX_RETRIES) {
              await new Promise(resolve => setTimeout(resolve, RETRY_DELAY_MS * attempt));
              continue;
            }
            
            throw new Error('Fel vid uppladdning. Vänligen försök igen.');
          }
          
          if (!data?.publicUrl) {"""
          new_upload_block = """      const { data } = supabase.storage.from(BUCKET).getPublicUrl(path);
          
          if (!data?.publicUrl) {"""
          text = replace_once(text, old_upload_block, new_upload_block, 'check getPublicUrl block')
          text = replace_once(
              text,
              'const processFiles = async (files: FileList): Promise<MediaFile[]> => {\n  const processed = await Promise.all(Array.from(files).map(async file => {',
              'const processFiles = async (files: FileList): Promise<MediaFile[]> => {\n  const processed: Array<MediaFile | null> = await Promise.all(Array.from(files).map(async (file): Promise<MediaFile | null> => {',
              'check processFiles typing',
          )
          text = replace_once(
              text,
              'function slugify(str: string): string {',
              'function slugify(str: string | null | undefined): string {',
              'check slugify input type',
          )
          text = replace_once(
              text,
              '            let typeString = type;',
              '            let typeString: string = type;',
              'check sanering typeString',
          )
          write(path, text)

          print('Mechanical TypeScript repair A applied successfully')
          PY

      - name: Verify patch shape
        run: |
          git diff --check
          git diff --stat

      - name: Install dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Measure TypeScript after repair A
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false 2>&1 | tee tsc-after.log
          TSC_STATUS=${PIPESTATUS[0]}
          ERROR_COUNT=$(grep -c 'error TS' tsc-after.log || true)
          FILE_COUNT=$(grep 'error TS' tsc-after.log | sed -E 's/^([^(:]+).*/\1/' | sort -u | wc -l | tr -d ' ')
          echo "TSC_EXIT=$TSC_STATUS"
          echo "TSC_ERROR_COUNT=$ERROR_COUNT"
          echo "TSC_FILE_COUNT=$FILE_COUNT"
          echo '--- errors by file ---'
          grep 'error TS' tsc-after.log | sed -E 's/^([^(:]+).*/\1/' | sort | uniq -c | sort -nr || true
          exit 0

      - name: Commit repair A to branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/check/form-client.tsx app/nybil/form-client.tsx app/status/form-client.tsx components/ImageAnnotator.tsx components/MediaGallery.tsx lib/damages.ts
          git commit -m 'Repair mechanical TypeScript errors' || exit 0
          git push origin HEAD:stabilize-build-gates
