name: Framework 2.3B temp

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: framework-next15-2-3b

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Install exact candidate
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Verify proxy auth boundary without external calls
        run: |
          cat > proxy-check-temp.ts <<'TS'
          import { NextRequest } from 'next/server';
          import { proxy } from './proxy';

          async function main() {
            const protectedRequest = new NextRequest('https://example.com/api/vehicle-info?reg=GEU29F');
            const protectedResponse = await proxy(protectedRequest);
            const protectedBody = await protectedResponse.clone().json();
            if (protectedResponse.status !== 401 || protectedBody?.error !== 'Authentication required') {
              throw new Error(`Protected API boundary failed: ${protectedResponse.status} ${JSON.stringify(protectedBody)}`);
            }

            const healthRequest = new NextRequest('https://example.com/api/health');
            const healthResponse = await proxy(healthRequest);
            if (healthResponse.status !== 200) {
              throw new Error(`Health pass-through failed: ${healthResponse.status}`);
            }

            console.log('PROXY_AUTH_NEGATIVE_OK', protectedResponse.status, protectedBody.error);
            console.log('PROXY_HEALTH_PASSTHROUGH_OK', healthResponse.status);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          TS
          npx tsx proxy-check-temp.ts
          rm proxy-check-temp.ts

      - name: Security audit must be clean
        run: |
          npm audit --json > audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const counts = audit.metadata?.vulnerabilities || {};
          console.log('AUDIT_COUNTS', JSON.stringify(counts));
          if ((counts.total || 0) !== 0) process.exit(1);
          NODE
          rm audit.json

      - name: Production build with isolated dummy env
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
          RESEND_API_KEY: re_dummy
          NEXT_PUBLIC_SITE_URL: https://example.com
        run: npm run build

      - name: Build must not rewrite tracked config
        run: git diff --exit-code

      - name: Show framework versions
        run: npm ls next react react-dom --depth=0
