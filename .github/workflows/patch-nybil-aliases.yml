name: Patch Nybil alias wiring

on:
  push:
    branches:
      - agent/step-3-2d-1-nybil-aliases

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[nybil aliases wired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/step-3-2d-1-nybil-aliases

      - name: Wire centralized Nybil aliases
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/nybil/form-client.tsx')
          text = path.read_text()

          replacements = [
              (
                  "import { compressImage } from '@/lib/image-utils';\n",
                  "import { compressImage } from '@/lib/image-utils';\nimport { withNybilLegacyAliases } from '@/lib/nybil-aliases';\n",
              ),
              (
                  "      const inventoryData = {\n",
                  "      const inventoryData = withNybilLegacyAliases({\n",
              ),
              ("        bilmodell: modell, // Alias for modell column\n", ""),
              ("        ankomstdatum: now.toISOString().split('T')[0], // Alias for registreringsdatum\n", ""),
              ("        monterade_dack: hjultyp, // Alias for hjultyp (what tires are mounted)\n", ""),
              ("        hjul_till_forvaring: hjulTillForvaring, // Alias for hjul_ej_monterade column\n", ""),
              ("        hjul_forvaring_station: wheelsNeedStorage ? hjulForvaringOrt : null, // Alias for hjul_forvaring_ort column\n", ""),
              ("        kompressor: dackkompressor, // Alias for dackkompressor column\n", ""),
              (
                  "        is_sold: null\n      };\n      console.log('Attempting to insert inventoryData:', inventoryData);",
                  "        is_sold: null\n      });\n      console.log('Attempting to insert inventoryData:', inventoryData);",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count}: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/nybil/form-client.tsx
          git diff --cached --check
          git commit -m "Wire centralized Nybil aliases [nybil aliases wired]"
          git push origin HEAD:agent/step-3-2d-1-nybil-aliases
