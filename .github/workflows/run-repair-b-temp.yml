name: Run Repair B temp

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  run-repair-b:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout stabilization branch
        uses: actions/checkout@v4
        with:
          ref: stabilize-build-gates

      - name: Apply Repair B
        run: |
          python3 .github/scripts/repair-b.py
          git diff --check
          git diff --stat

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Strict typecheck
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false 2>&1 | tee tsc.log
          STATUS=${PIPESTATUS[0]}
          COUNT=$(grep -c 'error TS' tsc.log || true)
          FILES=$(grep 'error TS' tsc.log | sed -E 's/^([^(:]+).*/\1/' | sort -u | wc -l | tr -d ' ')
          echo "TSC_EXIT=$STATUS"
          echo "TSC_ERROR_COUNT=$COUNT"
          echo "TSC_FILE_COUNT=$FILES"
          grep 'error TS' tsc.log | sed -E 's/^([^(:]+).*/\1/' | sort | uniq -c | sort -nr || true
          exit 0

      - name: Commit repaired files to stabilization branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/check/form-client.tsx lib/vehicle-status.ts
          git commit -m 'Align remaining TypeScript data contracts'
          git push origin HEAD:stabilize-build-gates
