name: Run runtime-preservation cleanup temp

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  preserve-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout stabilization branch
        uses: actions/checkout@v4
        with:
          ref: stabilize-build-gates

      - name: Apply runtime-preservation cleanup
        run: |
          python3 .github/scripts/preserve-runtime.py
          git diff --check
          git diff --stat

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Strict typecheck
        run: npm run typecheck

      - name: Commit cleanup to stabilization branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/check/form-client.tsx app/nybil/form-client.tsx lib/damages.ts lib/vehicle-status.ts
          git commit -m 'Preserve runtime behavior while fixing types'
          git push origin HEAD:stabilize-build-gates
