name: Run Repair C temp

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  run-repair-c:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout stabilization branch
        uses: actions/checkout@v4
        with:
          ref: stabilize-build-gates

      - name: Apply Repair C
        run: |
          python3 .github/scripts/repair-c.py
          git diff --check
          git diff --stat

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Strict typecheck
        run: npx tsc --noEmit --pretty false

      - name: Commit final type repair to stabilization branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/vehicle-status.ts
          git commit -m 'Complete strict TypeScript repair'
          git push origin HEAD:stabilize-build-gates
